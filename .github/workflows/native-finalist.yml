name: Native shipping image and held-out 60M
on:
  push:
    branches: [bench/native-x64-trials]
    paths: [perf/native/finalist.json]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read selected revision
        id: image
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re
          data = json.load(open('perf/native/finalist.json'))
          if not re.fullmatch(r'[0-9a-f]{40}', data['commit']) or not re.fullmatch(r'[a-z-]+', data['variant']):
              raise ValueError('Expected a full release SHA and a build variant')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('commit', 'variant'):
                  print(f'{key}={data[key]}', file=output)
          PY
      - name: Check out selected shipping sources
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.image.outputs.commit }}
          path: .acceptance/candidate
          persist-credentials: false
      - name: Check out the scored control
        uses: actions/checkout@v4
        with:
          ref: 4db76beed31640ddf4b414ed19deba5ebc660b81
          path: .acceptance/baseline
          persist-credentials: false
      - name: Check out the official 0.33-second release
        uses: actions/checkout@v4
        with:
          ref: dc216ac44dcaeb30ace2af3f2d2ff1d782ef78f0
          path: .acceptance/previous
          persist-credentials: false
      - name: Check out the corrected GCC reference
        uses: actions/checkout@v4
        with:
          ref: 5230d4835e1b2f9f6b48d1dc53319a3e2b658077
          path: .acceptance/corrected-gcc
          persist-credentials: false
      - name: Check out the qualified Clang release
        uses: actions/checkout@v4
        with:
          ref: 29ee0cc5c26291c511cad44aec18c6531f050f79
          path: .acceptance/qualified-clang
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare generator, fixtures and references
        run: bash perf/native/prepare-port-runner.sh
      - name: Record the previous build on the long identity link
        shell: bash
        run: |
          old="$RUNNER_TEMP/shopping-trials/previous"
          docker buildx build --platform linux/amd64 --output "type=local,dest=$old" .acceptance/previous
          gcc="$RUNNER_TEMP/shopping-trials/corrected-gcc"
          docker buildx build --platform linux/amd64 --output "type=local,dest=$gcc" .acceptance/corrected-gcc
          clang="$RUNNER_TEMP/shopping-trials/qualified-clang"
          docker buildx build --platform linux/amd64 --output "type=local,dest=$clang" .acceptance/qualified-clang
          python="$RUNNER_TEMP/shopping-python/bin/python"
          if "$python" .acceptance/candidate/tests/pipeline/long_link.py "$old/app/shopping" >"$old/long-link.log" 2>&1; then
            echo '::notice title=Previous release identity check::This build produced the expected 43 user-day rows.'
          else
            grep -q AssertionError "$old/long-link.log"
            grep -q Merged "$old/long-link.log"
            echo '::notice title=Previous release identity check::The old binary joined the two purchases. The corrected release must pass this test.'
          fi
      - name: Verify the release images and time fresh containers
        id: qualify
        env:
          CXX: g++-12
        run: |
          "$RUNNER_TEMP/shopping-python/bin/python" perf/native/port_acceptance.py \
            --candidate-source "$GITHUB_WORKSPACE/.acceptance/candidate" \
            --comparison-binary "corrected-gcc=$RUNNER_TEMP/shopping-trials/corrected-gcc/app/shopping" \
            --comparison-binary "qualified-clang=$RUNNER_TEMP/shopping-trials/qualified-clang/app/shopping" \
            --previous-release "$RUNNER_TEMP/shopping-trials/previous/app/shopping" \
            --release-generated-practice --release-generated-final \
            --warm-20 9 --warm-60 5 --cold-runs 1 --container-lifetime-pairs 5 --input-policy-rounds 5
          python3 - "$RUNNER_TEMP/shopping-trials/results/port-acceptance/status.json" <<'PY'
          import json, sys
          state = json.load(open(sys.argv[1]))
          for size in ("1M", "20M", "60M"):
              assert f"{size}/qualified-clang" in state["verified"], size
          PY
      - name: Publish native measurements and qualification
        if: always()
        run: |
          results="$RUNNER_TEMP/shopping-trials/results"
          if test -f "$results/port-acceptance/status.json"; then python3 perf/native/publish_profile.py "$results"; fi
      - name: Compare mapped input and buffered reads
        if: steps.qualify.outcome == 'success'
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP'])/'shopping-trials/results/port-acceptance/status.json'
          for scale, trial in json.loads(path.read_text())['input_policies'].items():
              print(f'::notice file=BENCHMARKS.md,line=1,title={scale} input policies::{json.dumps(trial, sort_keys=True)}')
          PY
      - name: Publish paired changes against the 0.33-second executable
        if: steps.qualify.outcome == 'success'
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = Path(os.environ["RUNNER_TEMP"]) / "shopping-trials/results/port-acceptance/status.json"
          state = json.loads(report.read_text())
          for size, timings in state["previous_release"]["timings"].items():
              for cache in ("warm", "cold"):
                  before, after = (timings[cache + "/" + tag] for tag in ("baseline", "candidate"))
                  msg = f"previous {before['median_s']:.4f}s, corrected {after['median_s']:.4f}s, paired {after['paired_change_median']:+.3%}, {after['faster_pairs']}/{len(after['seconds'])} wins, {after['peak_mib']:.1f} MiB RSS"
                  print(f"::notice file=BENCHMARKS.md,line=1,title={size} {cache} previous release::" + msg.replace("%", "%25"))
          PY
      - name: Check held-out seed 733 with eight application workers
        if: steps.qualify.outcome == 'success'
        env:
          SHIPPING_SHA: ${{ steps.image.outputs.commit }}
        run: |
          "$RUNNER_TEMP/shopping-python/bin/python" perf/native/holdout_shipping.py --shipping-commit "$SHIPPING_SHA"
      - name: Verify both 1M tables with baseline x86-64 instruction dispatch
        if: steps.qualify.outcome == 'success'
        shell: bash
        run: |
          if ! command -v qemu-x86_64; then sudo apt-get -qq update && sudo apt-get install -y qemu-user; fi
          area="$RUNNER_TEMP/shopping-trials"
          out="$area/results/baseline-isa"
          mkdir -p "$out"
          export NCPU=1 XL_TIMING=1
          for mode in compact generic; do
            flags=()
            if test "$mode" = generic; then flags=(--generic); fi
            temp=$(mktemp -d "$RUNNER_TEMP/isa-output.XXXXXX")
            qemu-x86_64 -cpu Nehalem "$area/accept-binaries/candidate/shopping" "${flags[@]}" \
              "$area/dev" "$temp" > "$out/$mode.log" 2>&1
            if test "$mode" = compact; then grep -q 'parse=' "$out/$mode.log"; fi
            "$RUNNER_TEMP/shopping-python/bin/python" "$area/starter-pyspark/scripts/compare.py" \
              "$temp" "$area/dev-answer" >> "$out/$mode.log"
            rm -r -- "$temp"
          done
          echo '::notice title=Portable x86-64 release::The compact and explicitly selected generic parsers each matched both published 1M tables on a Nehalem CPU model.'
      - name: Exercise native SIMD and parked-worker retry paths
        if: always() && steps.qualify.outcome == 'success'
        env:
          CXX: g++-12
          SHIPPING_SHA: ${{ steps.image.outputs.commit }}
          SHIPPING_VARIANT: ${{ steps.image.outputs.variant }}
        run: |
          area="$RUNNER_TEMP/shopping-trials"
          "$RUNNER_TEMP/shopping-python/bin/python" perf/native/native_code_paths.py \
            --source "$GITHUB_WORKSPACE/.acceptance/candidate" --revision "$SHIPPING_SHA" \
            --variant "$SHIPPING_VARIANT" --release "$area/accept-binaries/candidate/shopping" \
            --output "$area/results/native-code-paths"
      - name: Verify the shipping image objects on row boundaries and repairs
        if: always() && steps.qualify.outcome == 'success'
        run: |
          python3 perf/native/finalist_rows.py .acceptance/candidate "$RUNNER_TEMP/shopping-trials/accept-binaries/candidate/shopping"
      - name: Publish instruction coverage
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP'])/'shopping-trials/results/native-code-paths/status.json'
          if p.is_file():
              r=json.loads(p.read_text())
              print('::notice file=BENCHMARKS.md,line=1,title=Native instruction coverage::' +
                    json.dumps({'status':r['status'],'features':r['features'],'checks':{k:v['status'] for k,v in r['checks'].items()}},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shipping-image-measurements
          path: ${{ runner.temp }}/shopping-trials/results/
          retention-days: 7
