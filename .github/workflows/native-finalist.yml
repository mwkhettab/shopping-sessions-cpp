name: Native input page population qualification
on:
  push:
    branches: [bench/native-x64-trials]
    paths: [perf/native/finalist.json]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out the published C++ release
        uses: actions/checkout@v4
        with:
          ref: f1e4c0c6bea3066cd5b03c7b0d6505444af35320
          path: .acceptance/candidate
          persist-credentials: false
      - name: Check out the official 0.30 s control
        uses: actions/checkout@v4
        with:
          ref: 7f59c0b8c268d735ebc3e3ecbd68c7a17302e4b1
          path: .acceptance/baseline
          persist-credentials: false
      - name: Build the exact trial tree from the published sources
        id: image
        shell: bash
        run: |
          src=.acceptance/candidate
          area="$RUNNER_TEMP/published"
          docker buildx build --platform linux/amd64 --output "type=local,dest=$area" "$src"
          git -C "$src" apply "$GITHUB_WORKSPACE/perf/native/populate-input.patch"
          git -C "$src" add cpp/pipeline/parse.hpp tests/pipeline/user_codecs.cpp
          python3 - <<'PYTHON'
          import json, subprocess
          config=json.load(open('perf/native/finalist.json'))
          git=['git','-C','.acceptance/candidate']
          assert subprocess.check_output(git+['rev-parse','HEAD'],text=True).strip()==config['base']
          for path,value in config['blobs'].items():
              assert subprocess.check_output(git+['rev-parse',':'+path],text=True).strip()==value
          PYTHON
          git -C "$src" -c user.name="Benchmark runner" -c user.email="benchmark@localhost" commit -m 'Test input page population'
          echo "commit=$(git -C "$src" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "variant=control" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare generator, fixtures and references
        run: bash perf/native/prepare-port-runner.sh
      - name: Test every bit width, run boundary and Parquet group on this CPU
        shell: bash
        run: |
          src=.acceptance/candidate
          for target in native portable; do
            flags=()
            if test "$target" = portable; then flags=(-DSHOP_SPARSE_FORCE_SCALAR); fi
            c++ -std=c++20 -O3 "${flags[@]}" -I"$src/cpp/pipeline" "$src/tests/pipeline/user_codecs.cpp" -o "$RUNNER_TEMP/codecs"
            "$RUNNER_TEMP/codecs"
            c++ -std=c++20 -O3 "${flags[@]}" -I"$src/cpp/pipeline" "$src/tests/pipeline/sparse_user_groups.cpp" -o "$RUNNER_TEMP/user-groups"
            "$RUNNER_TEMP/shopping-python/bin/python" "$src/tests/pipeline/sparse_user_groups.py" "$RUNNER_TEMP/user-groups"
          done
      - name: Compare full processes and shipping containers
        id: qualify
        env:
          CXX: g++-12
        run: |
          area="$RUNNER_TEMP/shopping-trials"
          "$RUNNER_TEMP/shopping-python/bin/python" perf/native/port_acceptance.py \
            --candidate-source "$GITHUB_WORKSPACE/.acceptance/candidate" \
            --require-baseline-commit 7f59c0b8c268d735ebc3e3ecbd68c7a17302e4b1 \
            --comparison-binary "published=$RUNNER_TEMP/published/app/shopping" \
            --release-generated-practice --release-generated-final \
            --warm-20 11 --warm-60 7 --cold-runs 2 --container-lifetime-pairs 9
          python3 - "$area/results/port-acceptance/status.json" <<'PYTHON'
          import json,sys
          state=json.load(open(sys.argv[1]))
          for size in ("1M","20M","60M"):
              assert all(f"{size}/{tag}" in state["verified"] for tag in ("published","baseline","candidate")),size
          PYTHON
      - name: Publish native measurements and qualification
        if: always()
        run: |
          results="$RUNNER_TEMP/shopping-trials/results"
          if test -f "$results/port-acceptance/status.json"; then python3 perf/native/publish_profile.py "$results"; fi
      - name: Check held-out seed 733 with eight application workers
        if: steps.qualify.outcome == 'success'
        env:
          SHIPPING_SHA: ${{ steps.image.outputs.commit }}
        run: |
          "$RUNNER_TEMP/shopping-python/bin/python" perf/native/holdout_shipping.py --shipping-commit "$SHIPPING_SHA" --baseline-commit 7f59c0b8c268d735ebc3e3ecbd68c7a17302e4b1
          python3 - "$RUNNER_TEMP/shopping-trials/results" <<'PYTHON'
          from pathlib import Path
          import sys,json
          record=json.loads(next(Path(sys.argv[1]).glob("shipping-733-*/status.json")).read_text())
          expected={'campaign_daily': {'rows': 28014, 'sha256': '26f47d8f745a814bf3c80fbe53af7f21a87d252ef91ea1e3afa9437daedb74f5'}, 'user_daily': {'rows': 6621736, 'sha256': '11821bf58ec2cb4407bef662c80988e20b3860587110d7d345dfe06c7c104d96'}}
          assert record["tables"]["baseline"] == record["tables"]["shipping"] == expected
          PYTHON
      - name: Verify both 1M tables with baseline x86-64 instruction dispatch
        if: steps.qualify.outcome == 'success'
        shell: bash
        run: |
          if ! command -v qemu-x86_64; then sudo apt-get -qq update && sudo apt-get install -y qemu-user; fi
          area="$RUNNER_TEMP/shopping-trials"
          out="$area/results/baseline-isa"
          mkdir -p "$out"
          export NCPU=1 XL_TIMING=1
          for tag in baseline candidate; do
          for mode in compact generic; do
            flags=()
            if test "$mode" = generic; then flags=(--generic); fi
            temp=$(mktemp -d "$RUNNER_TEMP/isa-output.XXXXXX")
            qemu-x86_64 -cpu Nehalem "$area/accept-binaries/$tag/shopping" "${flags[@]}" \
              "$area/dev" "$temp" > "$out/$mode.log" 2>&1
            if test "$mode" = compact; then grep -q 'parse=' "$out/$mode.log"; fi
            "$RUNNER_TEMP/shopping-python/bin/python" "$area/starter-pyspark/scripts/compare.py" \
              "$temp" "$area/dev-answer" >> "$out/$mode.log"
            rm -r -- "$temp"
          done
          done
          echo '::notice title=Portable x86-64 release::The compact and explicitly selected generic parsers each matched both published 1M tables on a Nehalem CPU model.'
      - name: Exercise native SIMD and parked-worker retry paths
        if: always() && steps.qualify.outcome == 'success'
        env:
          CXX: g++-12
          SHIPPING_SHA: ${{ steps.image.outputs.commit }}
          SHIPPING_VARIANT: ${{ steps.image.outputs.variant }}
        run: |
          area="$RUNNER_TEMP/shopping-trials"
          "$RUNNER_TEMP/shopping-python/bin/python" perf/native/native_code_paths.py \
            --source "$GITHUB_WORKSPACE/.acceptance/candidate" --revision "$SHIPPING_SHA" \
            --variant "$SHIPPING_VARIANT" --release "$area/accept-binaries/candidate/shopping" \
            --output "$area/results/native-code-paths"
      - name: Verify the shipping image objects on row boundaries and repairs
        if: always() && steps.qualify.outcome == 'success'
        run: |
          python3 perf/native/finalist_rows.py .acceptance/candidate "$RUNNER_TEMP/shopping-trials/accept-binaries/candidate/shopping"
      - name: Publish instruction coverage
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP'])/'shopping-trials/results/native-code-paths/status.json'
          if p.is_file():
              r=json.loads(p.read_text())
              print('::notice file=BENCHMARKS.md,line=1,title=Native instruction coverage::' +
                    json.dumps({'status':r['status'],'features':r['features'],'checks':{k:v['status'] for k,v in r['checks'].items()}},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shipping-image-measurements
          path: ${{ runner.temp }}/shopping-trials/results/
          retention-days: 7
