name: Native x64 benchmark
on:
  workflow_dispatch:
    inputs:
      peer_repository:
        description: Optional public repository for a same-host release comparison
        required: false
        type: string
      peer_revision:
        description: Full commit SHA of the optional comparison
        required: false
        type: string
      peer_run_id:
        description: Optional run ID for an additional comparison artifact
        required: false
        type: string
      peer_artifact:
        description: Optional artifact containing a release executable or a Docker build context
        required: false
        type: string
  push:
    branches: [bench/native-x64-trials]
    paths-ignore:
      - perf/native/recover-runs.json
      - perf/native/publish_profile.py
      - .github/workflows/native-report.yml
      - .github/workflows/native-trials.yml
      - perf/native/run.py
permissions:
  contents: read
  actions: read
jobs:
  compare:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {os: ubuntu-24.04, lane: primary}
          - {os: ubuntu-24.04, lane: secondary}
          - {os: ubuntu-22.04, lane: portable}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 115
    steps:
      - name: Identify CPU vendor
        id: hardware
        shell: bash
        run: |
          vendor=$(awk -F: '/^vendor_id/{gsub(/ /,"",$2); print $2; exit}' /proc/cpuinfo)
          if [ "$vendor" != GenuineIntel ] && [ "${{ matrix.lane }}" != portable ]; then
            echo "run=no" >> "$GITHUB_OUTPUT"
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi
          lscpu
      - uses: actions/checkout@v4
        if: steps.hardware.outputs.run == 'yes'
        with:
          persist-credentials: false
      - name: Check out the C++ release under test
        if: steps.hardware.outputs.run == 'yes'
        uses: actions/checkout@v4
        with:
          ref: faf1047c6cb00cc8099572f5e067d18076375571
          path: .acceptance/candidate
          persist-credentials: false
      - name: Check out the officially scored C++ baseline
        if: steps.hardware.outputs.run == 'yes'
        uses: actions/checkout@v4
        with:
          ref: 4db76beed31640ddf4b414ed19deba5ebc660b81
          path: .acceptance/baseline
          persist-credentials: false
      - name: Check out the runtime alternatives
        if: steps.hardware.outputs.run == 'yes' && matrix.lane != 'portable'
        uses: actions/checkout@v4
        with:
          ref: b5f19ac6cc222f166ae9581a8cef9b87bb3c4263
          path: .acceptance/runtime
          persist-credentials: false
      - name: Check out optional comparison sources
        if: steps.hardware.outputs.run == 'yes' && (inputs.peer_repository || vars.NATIVE_PEER_REPOSITORY) && (inputs.peer_revision || vars.NATIVE_PEER_REVISION)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.peer_repository || vars.NATIVE_PEER_REPOSITORY }}
          ref: ${{ inputs.peer_revision || vars.NATIVE_PEER_REVISION }}
          path: .acceptance/peer
          persist-credentials: false
      - name: Read optional comparison artifact
        if: steps.hardware.outputs.run == 'yes' && (inputs.peer_run_id || vars.NATIVE_PEER_RUN_ID) && (inputs.peer_artifact || vars.NATIVE_PEER_ARTIFACT)
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.peer_run_id || vars.NATIVE_PEER_RUN_ID }}
          name: ${{ inputs.peer_artifact || vars.NATIVE_PEER_ARTIFACT }}
          path: ${{ runner.temp }}/shopping-peer
      - uses: actions/setup-python@v5
        if: steps.hardware.outputs.run == 'yes'
        with:
          python-version: '3.12'
      - name: Prepare public generator, fixtures and references
        if: steps.hardware.outputs.run == 'yes'
        shell: bash
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/shopping-trials"
          cd "$RUNNER_TEMP/shopping-trials"
          base=https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files
          for archive in generator starter-pyspark dev-answer; do
            curl --fail --location --retry 3 --silent --show-error "$base/$archive.zip" -o "$archive.zip"
          done
          sha256sum --check "$GITHUB_WORKSPACE/perf/native/archives.sha256"
          for archive in generator starter-pyspark dev-answer; do unzip -q "$archive.zip"; done
          cargo build --manifest-path generator/Cargo.toml --release --offline
          generator/target/release/generate --seed 1 --events 1000000 --clicks 250000 --threads 4 --output dev
          generator/target/release/generate --seed 23 --events 20000000 --clicks 5000000 --threads 4 --output practice
          python3 -m venv "$RUNNER_TEMP/shopping-python"
          "$RUNNER_TEMP/shopping-python/bin/pip" install --quiet pyarrow==21.0.0 polars==2.1.0
          if ! command -v g++-12; then sudo apt-get -qq update && sudo apt-get install -y g++-12; fi
          lscpu
          df -h .
      - name: Validate release images and compare native processes
        if: steps.hardware.outputs.run == 'yes'
        shell: bash
        env:
          PEER_REPOSITORY: ${{ inputs.peer_repository || vars.NATIVE_PEER_REPOSITORY }}
          PEER_REVISION: ${{ inputs.peer_revision || vars.NATIVE_PEER_REVISION }}
          PEER_RUN_ID: ${{ inputs.peer_run_id || vars.NATIVE_PEER_RUN_ID }}
          PEER_ARTIFACT: ${{ inputs.peer_artifact || vars.NATIVE_PEER_ARTIFACT }}
          CXX: g++-12
        run: |
          set -eu
          peer="$RUNNER_TEMP/shopping-peer"
          extra=()
          case '${{ matrix.lane }}' in
            primary) extra+=(--runtime-source "$GITHUB_WORKSPACE/.acceptance/runtime" --runtime-builds control paired memory paired-memory dictionary) ;;
            secondary) extra+=(--runtime-source "$GITHUB_WORKSPACE/.acceptance/runtime" --runtime-builds control paired-memory paired-memory-layout paired-memory-v4 complete) ;;
          esac
          if [[ -n "$PEER_REPOSITORY" || -n "$PEER_REVISION" ]]; then
            if [[ -n "$PEER_RUN_ID" || -n "$PEER_ARTIFACT" || -z "$PEER_REPOSITORY" || ! "$PEER_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Supply either a full repository revision or a comparison artifact."
              exit 2
            fi
            test "$(git -C .acceptance/peer rev-parse HEAD)" = "$PEER_REVISION"
            extra+=(--peer-source "$GITHUB_WORKSPACE/.acceptance/peer")
          elif [[ -n "$PEER_RUN_ID" || -n "$PEER_ARTIFACT" ]]; then
            if [[ -z "$PEER_RUN_ID" || -z "$PEER_ARTIFACT" ]]; then
              echo "Both peer_run_id and peer_artifact are required to load an optional job artifact."
              exit 2
            elif [[ -f "$peer/Dockerfile" ]]; then
              extra+=(--peer-source "$peer")
            elif [[ -f "$peer/source/Dockerfile" ]]; then
              extra+=(--peer-source "$peer/source")
            elif [[ -f "$peer/pipeline" ]]; then
              extra+=(--peer-binary "$peer/pipeline")
            else
              echo "The comparison artifact needs a pipeline executable or a Dockerfile build context."
              exit 2
            fi
          fi
          "$RUNNER_TEMP/shopping-python/bin/python" perf/native/port_acceptance.py --candidate-source "$GITHUB_WORKSPACE/.acceptance/candidate" --release-generated-practice "${extra[@]}"
      - uses: actions/upload-artifact@v4
        if: always() && steps.hardware.outputs.run == 'yes'
        with:
          name: native-observations-${{ matrix.lane }}
          path: ${{ runner.temp }}/shopping-trials/results/
          retention-days: 7
